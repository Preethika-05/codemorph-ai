# Server Port Configuration (Render sets the PORT environment variable automatically)
server.port=${PORT:8085}

# Spring Boot Configuration
spring.application.name=codemorph-ai

# Gemini API Configuration
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
gemini.model=${AI_MODEL:${GEMINI_MODEL:gemini-flash-latest}}
ai.provider=${AI_PROVIDER:gemini}
ai.api.url=${AI_API_URL:}
ai.api.key=${AI_API_KEY:${GEMINI_API_KEY:}}
